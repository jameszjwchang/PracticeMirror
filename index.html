<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Mirror</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <button id="recordButton" class="big-button">Record</button>
    <button id="saveButton" class="save-button hidden">Save</button>
    <div id="playerContainer" class="hidden">
      <audio id="player" controls></audio>
      <div class="speed-control">
        <label for="speedControl">Speed:</label>
        <select id="speedControl">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
    </div>
    <div id="folders">
      <div id="inboxContainer"></div>
      <div id="folderControls">
        <input type="text" id="newFolderName" placeholder="New folder name" />
        <button id="addFolder">Add Folder</button>
      </div>
      <div id="folderList"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
